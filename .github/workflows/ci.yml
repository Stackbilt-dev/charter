name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run supply-chain:check
      - run: pnpm run build
      - name: Verify context routing benchmark
        run: pnpm run benchmark:context
      - name: Measure brief token budget
        run: node scripts/measure-brief-size.mjs
      - name: Eval brief orientation coverage
        run: node scripts/eval-brief-coverage.mjs
      - run: pnpm run typecheck
      - name: Docs sync check
        run: pnpm run docs:check
        if: hashFiles('.docsync.json') != ''
      - run: pnpm run verify:adf
      - run: pnpm run test
      - run: node packages/cli/dist/bin.js --help

