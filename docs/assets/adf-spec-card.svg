<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ADF Attention-Directed Format Draft 0.1</title>
  <desc id="description">A neutral standards card illustrating one manifest routing core, frontend, and security context modules into agent files.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf3ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4668e8"/>
      <stop offset="1" stop-color="#25a9b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#24345d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1090" cy="-10" r="250" fill="#4668e8" opacity="0.06"/>
  <circle cx="70" cy="650" r="260" fill="#25a9b8" opacity="0.05"/>

  <text x="80" y="98" fill="url(#mark)" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="3">ADF</text>
  <text x="80" y="158" fill="#15213b" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800">Attention-Directed Format</text>
  <text x="80" y="202" fill="#536079" font-family="Inter, system-ui, sans-serif" font-size="23">A vendor-neutral specification for modular AI-agent context</text>

  <g filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="80" y="270" width="260" height="210" rx="18" fill="#ffffff" stroke="#cbd6ee"/>
    <text x="110" y="315" fill="#4668e8" font-size="19" font-weight="700">manifest.adf</text>
    <text x="110" y="355" fill="#536079" font-size="16">DEFAULT_LOAD</text>
    <text x="130" y="383" fill="#15213b" font-size="17">core.adf</text>
    <text x="110" y="423" fill="#536079" font-size="16">ON_DEMAND</text>
    <text x="130" y="451" fill="#15213b" font-size="17">frontend · security</text>

    <path d="M340 375H445" stroke="#7f91ba" stroke-width="3"/>
    <path d="M430 364l15 11-15 11" fill="none" stroke="#7f91ba" stroke-width="3"/>

    <rect x="445" y="248" width="280" height="254" rx="18" fill="#ffffff" stroke="#cbd6ee"/>
    <text x="475" y="290" fill="#25a9b8" font-size="18" font-weight="700">TASK ROUTING</text>
    <rect x="475" y="316" width="220" height="44" rx="10" fill="#edf3ff"/>
    <text x="495" y="344" fill="#15213b" font-size="16">core.adf</text>
    <rect x="475" y="374" width="220" height="44" rx="10" fill="#e8f8f7"/>
    <text x="495" y="402" fill="#15213b" font-size="16">+ matching module</text>
    <text x="475" y="462" fill="#536079" font-size="15">deterministic · no LLM</text>

    <path d="M725 375H830" stroke="#7f91ba" stroke-width="3"/>
    <path d="M815 364l15 11-15 11" fill="none" stroke="#7f91ba" stroke-width="3"/>

    <rect x="830" y="270" width="290" height="210" rx="18" fill="#ffffff" stroke="#cbd6ee"/>
    <text x="860" y="315" fill="#4668e8" font-size="18" font-weight="700">INTEROPERABILITY</text>
    <text x="860" y="357" fill="#15213b" font-size="16">AGENTS.md</text>
    <text x="860" y="389" fill="#15213b" font-size="16">CLAUDE.md</text>
    <text x="860" y="421" fill="#15213b" font-size="16">.cursorrules</text>
    <text x="860" y="453" fill="#15213b" font-size="16">GEMINI.md</text>
  </g>

  <text x="80" y="560" fill="#536079" font-family="Inter, system-ui, sans-serif" font-size="18">Draft 0.1 · Apache-2.0 · parser, resolver and compiler conformance fixtures</text>
  <text x="1120" y="560" fill="#4668e8" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="end">github.com/adf-spec/adf</text>
</svg>
