<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Charter context routing benchmark</title>
  <desc id="description">A terminal-style benchmark card showing 30 of 30 rules preserved and an average 58.1 percent estimated context reduction across four tasks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="1" stop-color="#111a32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63d8e3"/>
      <stop offset="1" stop-color="#5f7fff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="220" fill="#5f7fff" opacity="0.08"/>
  <circle cx="95" cy="600" r="250" fill="#63d8e3" opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="70" y="55" width="1060" height="520" rx="22" fill="#0b1020" stroke="#263458" stroke-width="2"/>
    <path d="M70 112h1060" stroke="#263458" stroke-width="2"/>
    <circle cx="105" cy="84" r="8" fill="#ff6b6b"/>
    <circle cx="133" cy="84" r="8" fill="#f7c948"/>
    <circle cx="161" cy="84" r="8" fill="#8bd450"/>
    <text x="600" y="91" fill="#8b98b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">charter — context routing benchmark</text>
  </g>

  <text x="105" y="157" fill="#63d8e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">$ pnpm run benchmark:context</text>
  <text x="105" y="205" fill="#f7f9fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700">30/30 rules preserved</text>

  <text x="105" y="255" fill="#8b98b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">TASK</text>
  <text x="355" y="255" fill="#8b98b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">BASELINE</text>
  <text x="520" y="255" fill="#8b98b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">ROUTED</text>
  <text x="665" y="255" fill="#8b98b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">REDUCTION</text>
  <path d="M105 273h990" stroke="#263458"/>

  <g fill="#dce4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="105" y="310">frontend</text><text x="390" y="310">580</text><text x="545" y="310">252</text><text x="690" y="310" fill="#8bd450">56.6%</text>
    <text x="105" y="352">secure API</text><text x="390" y="352">580</text><text x="545" y="352">348</text><text x="690" y="352" fill="#8bd450">40.0%</text>
    <text x="105" y="394">release</text><text x="390" y="394">580</text><text x="545" y="394">242</text><text x="690" y="394" fill="#8bd450">58.3%</text>
    <text x="105" y="436">core only</text><text x="390" y="436">580</text><text x="545" y="436">131</text><text x="690" y="436" fill="#8bd450">77.4%</text>
  </g>

  <rect x="845" y="245" width="250" height="205" rx="16" fill="#111a32" stroke="#34456f"/>
  <text x="970" y="295" fill="#8b98b5" font-family="Inter, system-ui, sans-serif" font-size="17" text-anchor="middle">AVERAGE ESTIMATED</text>
  <text x="970" y="320" fill="#8b98b5" font-family="Inter, system-ui, sans-serif" font-size="17" text-anchor="middle">CONTEXT REDUCTION</text>
  <text x="970" y="390" fill="url(#accent)" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" text-anchor="middle">58.1%</text>
  <text x="970" y="425" fill="#8bd450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">SNAPSHOT: PASS</text>

  <path d="M105 478h990" stroke="#263458"/>
  <text x="105" y="515" fill="#8b98b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Deterministic ADF resolver • synthetic fixture • ~4 chars/token estimator</text>
  <text x="105" y="548" fill="#5f7fff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Charter</text>
  <text x="185" y="548" fill="#8b98b5" font-family="Inter, system-ui, sans-serif" font-size="16">reference implementation</text>
  <text x="1095" y="548" fill="#63d8e3" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="end">adf-spec/adf</text>
</svg>
